<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Part Creator Icon - Bauteil/Würfel -->
  <defs>
    <linearGradient id="partGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E84C3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C83A2A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" fill="white" opacity="0"/>
  
  <!-- 3D Würfel (isometrisch) -->
  <!-- Vorderseite -->
  <rect x="16" y="20" width="24" height="24" fill="url(#partGrad)" stroke="#8B2817" stroke-width="1.5"/>
  
  <!-- Oberer Deckel -->
  <polygon points="16,20 24,12 48,12 40,20" fill="#F5A623" stroke="#D68910" stroke-width="1"/>
  
  <!-- Rechte Seite -->
  <polygon points="40,20 48,12 48,36 40,44" fill="#D9534F" stroke="#8B2817" stroke-width="1"/>
  
  <!-- Glanzeffekt (oben-links) -->
  <ellipse cx="22" cy="26" rx="3" ry="4" fill="white" opacity="0.3"/>
  
  <!-- Plus-Zeichen in der Mitte (Symbol für "erstellen/hinzufügen") -->
  <line x1="28" y1="30" x2="32" y2="30" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="28" x2="30" y2="32" stroke="white" stroke-width="1.5" opacity="0.7"/>
</svg>
