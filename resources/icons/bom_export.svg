<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- BOM/Stückliste Icon - Tabelle/Liste -->
  <defs>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FA31A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" fill="white" opacity="0"/>
  
  <!-- Tabellen-Rahmen -->
  <rect x="8" y="10" width="48" height="44" fill="white" stroke="url(#tableGrad)" stroke-width="1.5"/>
  
  <!-- Header Reihe (dunkel) -->
  <rect x="8" y="10" width="48" height="8" fill="url(#tableGrad)" stroke="url(#tableGrad)" stroke-width="1"/>
  
  <!-- Vertikale Linien (Spalten) -->
  <line x1="20" y1="10" x2="20" y2="54" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="44" y1="10" x2="44" y2="54" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Horizontale Linien (Reihen) -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="8" y1="30" x2="56" y2="30" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="8" y1="40" x2="56" y2="40" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Header Text (vereinfacht als kleine Linien) -->
  <line x1="11" y1="14" x2="17" y2="14" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="23" y1="14" x2="29" y2="14" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="35" y1="14" x2="41" y2="14" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="47" y1="14" x2="53" y2="14" stroke="white" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Daten in Zellen (kleine Punkte als Marker) -->
  <circle cx="14" cy="24" r="1" fill="#4A90E2" opacity="0.7"/>
  <circle cx="14" cy="34" r="1" fill="#4A90E2" opacity="0.7"/>
  <circle cx="14" cy="44" r="1" fill="#4A90E2" opacity="0.7"/>
  
  <circle cx="26" cy="24" r="1" fill="#4A90E2" opacity="0.7"/>
  <circle cx="26" cy="34" r="1" fill="#4A90E2" opacity="0.7"/>
  <circle cx="26" cy="44" r="1" fill="#4A90E2" opacity="0.7"/>
</svg>
