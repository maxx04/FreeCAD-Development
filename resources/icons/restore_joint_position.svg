<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Restore-Joint-Position Icon - Anker-Teil (fett) + ein einzelnes bewegliches Teil,
       verbunden durch eine Dreh-Achse (Revolute-Symbol) statt der gestrichelten Rigid-Group-
       Linien, kleiner Rueckkehr-Pfeil deutet "aus Original uebernommen" an -->
  <defs>
    <linearGradient id="gradAnchor2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C67F14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMoving" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4AE271;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E9E4E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Anker-Teil (fett, unten links) -->
  <g transform="translate(8, 34)">
    <rect x="0" y="0" width="18" height="18" fill="url(#gradAnchor2)" stroke="#8A5A0E" stroke-width="1.2"/>
    <polygon points="0,0 6,-5 24,-5 18,0" fill="#F7B84D"/>
    <polygon points="18,0 24,-5 24,13 18,18" fill="#8A5A0E"/>
  </g>

  <!-- Dreh-Achse (Revolute-Symbol): Achslinie + Kreispfeil, verbindet Anker mit beweglichem Teil -->
  <line x1="26" y1="34" x2="26" y2="12" stroke="#888888" stroke-width="2"/>
  <circle cx="26" cy="34" r="3" fill="none" stroke="#888888" stroke-width="1.5"/>
  <path d="M 20 26 A 8 8 0 1 1 26 34" fill="none" stroke="#5BA3F5" stroke-width="2"/>
  <polygon points="20,26 20,31 25,28" fill="#5BA3F5"/>

  <!-- Bewegliches Teil (Rotor-artig, kreisfoermig statt eckig, oben rechts) -->
  <g transform="translate(38, 12)">
    <circle cx="9" cy="9" r="9" fill="url(#gradMoving)" stroke="#1F6E33" stroke-width="1.2"/>
    <circle cx="9" cy="9" r="3.5" fill="#1F6E33"/>
  </g>

  <!-- Rueckkehr-Pfeil (aus Original uebernommen) -->
  <path d="M 44 34 A 10 10 0 1 0 52 42" fill="none" stroke="#F5A623" stroke-width="2.2"/>
  <polygon points="52,42 47,41 50,46" fill="#F5A623"/>
</svg>
