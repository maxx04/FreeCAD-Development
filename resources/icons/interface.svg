<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Interface Icon - Teil mit Schloss-Symbol, aehnlich Joint-Icon-Sprache -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Wuerfel (fixiertes Teil) -->
  <g transform="translate(8, 28)">
    <rect x="0" y="0" width="20" height="20" fill="url(#grad1)" stroke="#2E5C8A" stroke-width="0.8"/>
    <polygon points="0,0 7,-6 27,-6 20,0" fill="#5BA3F5" opacity="0.8"/>
    <polygon points="20,0 27,-6 27,14 20,20" fill="#2E5C8A" opacity="0.6"/>
  </g>

  <!-- Verbindungslinie zum Schloss -->
  <line x1="34" y1="34" x2="42" y2="34" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Schloss-Symbol (fixierte/gesperrte Placement) -->
  <g transform="translate(42, 22)">
    <rect x="0" y="10" width="16" height="13" rx="2" fill="#F5A623" stroke="#C77C11" stroke-width="1"/>
    <path d="M 3 10 L 3 6 A 5 5 0 0 1 13 6 L 13 10" fill="none" stroke="#C77C11" stroke-width="2"/>
    <circle cx="8" cy="16.5" r="1.8" fill="#1E1E1E"/>
  </g>
</svg>
