<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Manual Placement Icon - Koerper mit XYZ-Achsenkreuz und Zahleneingabe -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Wuerfel (zu platzierendes Teil) -->
  <g transform="translate(10, 30)">
    <rect x="0" y="0" width="18" height="18" fill="url(#grad1)" stroke="#2E5C8A" stroke-width="0.8"/>
    <polygon points="0,0 6,-5 24,-5 18,0" fill="#5BA3F5" opacity="0.8"/>
    <polygon points="18,0 24,-5 24,13 18,18" fill="#2E5C8A" opacity="0.6"/>
  </g>

  <!-- Achsenkreuz -->
  <line x1="19" y1="39" x2="45" y2="39" stroke="#E24A4A" stroke-width="2"/>
  <polygon points="45,39 40,36 40,42" fill="#E24A4A"/>
  <line x1="19" y1="39" x2="19" y2="13" stroke="#4AE271" stroke-width="2"/>
  <polygon points="19,13 16,18 22,18" fill="#4AE271"/>
  <line x1="19" y1="39" x2="34" y2="24" stroke="#4A90E2" stroke-width="2"/>
  <polygon points="34,24 28,25 30,31" fill="#4A90E2"/>

  <!-- Zahleneingabefeld -->
  <rect x="36" y="44" width="22" height="12" rx="2" fill="#1E1E1E" stroke="#F5A623" stroke-width="1.5"/>
  <text x="47" y="53" font-family="monospace" font-size="9" fill="#F5A623" text-anchor="middle">0.0</text>
</svg>
