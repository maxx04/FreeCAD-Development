<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Restore-Rigid-Group Icon - Anker-Teil (fett) + gruppierte Teile, per gestrichelten
       Linien starr verbunden, kleiner Rueckkehr-Pfeil deutet "aus Original uebernommen" an -->
  <defs>
    <linearGradient id="gradAnchor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C67F14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Starre Verbindungslinien (gestrichelt = Rigid Group) -->
  <line x1="20" y1="42" x2="42" y2="20" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="20" y1="42" x2="46" y2="46" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Anker-Teil (fett, unten links) -->
  <g transform="translate(10, 34)">
    <rect x="0" y="0" width="16" height="16" fill="url(#gradAnchor)" stroke="#8A5A0E" stroke-width="1.2"/>
    <polygon points="0,0 5,-4 21,-4 16,0" fill="#F7B84D"/>
    <polygon points="16,0 21,-4 21,12 16,16" fill="#8A5A0E"/>
  </g>

  <!-- Mitglieder (klein, oben rechts + rechts) -->
  <g transform="translate(36, 12)">
    <rect x="0" y="0" width="12" height="12" fill="url(#gradMember)" stroke="#2E5C8A" stroke-width="1"/>
    <polygon points="0,0 4,-3 16,-3 12,0" fill="#5BA3F5" opacity="0.85"/>
    <polygon points="12,0 16,-3 16,9 12,12" fill="#2E5C8A" opacity="0.7"/>
  </g>
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="12" height="12" fill="url(#gradMember)" stroke="#2E5C8A" stroke-width="1"/>
    <polygon points="0,0 4,-3 16,-3 12,0" fill="#5BA3F5" opacity="0.85"/>
    <polygon points="12,0 16,-3 16,9 12,12" fill="#2E5C8A" opacity="0.7"/>
  </g>

  <!-- Rueckkehr-Pfeil (aus Original uebernommen) -->
  <path d="M 44 8 A 10 10 0 1 0 52 16" fill="none" stroke="#4AE271" stroke-width="2.2"/>
  <polygon points="52,16 47,15 50,20" fill="#4AE271"/>
</svg>
