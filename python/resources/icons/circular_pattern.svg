<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Circular Pattern Icon - Elemente im Kreis angeordnet -->
  <defs>
    <linearGradient id="cgrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E27B4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BD5A35;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hintergrund transparent -->
  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Kreislinie (Pfad des Patterns) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#BD5A35" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Kleiner Würfel oben (12 Uhr) -->
  <g transform="translate(27, 5)">
    <rect x="0" y="0" width="9" height="9" fill="url(#cgrad1)" stroke="#8B3A1E" stroke-width="0.5"/>
    <polygon points="0,0 3,-2.5 12,-2.5 9,0" fill="#F59A6B" opacity="0.8"/>
    <polygon points="9,0 12,-2.5 12,6.5 9,9" fill="#8B3A1E" opacity="0.6"/>
  </g>

  <!-- Kleiner Würfel rechts (3 Uhr) -->
  <g transform="translate(50, 27)">
    <rect x="0" y="0" width="9" height="9" fill="url(#cgrad1)" stroke="#8B3A1E" stroke-width="0.5"/>
    <polygon points="0,0 3,-2.5 12,-2.5 9,0" fill="#F59A6B" opacity="0.8"/>
    <polygon points="9,0 12,-2.5 12,6.5 9,9" fill="#8B3A1E" opacity="0.6"/>
  </g>

  <!-- Kleiner Würfel unten (6 Uhr) -->
  <g transform="translate(27, 50)">
    <rect x="0" y="0" width="9" height="9" fill="url(#cgrad1)" stroke="#8B3A1E" stroke-width="0.5"/>
    <polygon points="0,0 3,-2.5 12,-2.5 9,0" fill="#F59A6B" opacity="0.8"/>
    <polygon points="9,0 12,-2.5 12,6.5 9,9" fill="#8B3A1E" opacity="0.6"/>
  </g>

  <!-- Kleiner Würfel links (9 Uhr) -->
  <g transform="translate(5, 27)">
    <rect x="0" y="0" width="9" height="9" fill="url(#cgrad1)" stroke="#8B3A1E" stroke-width="0.5"/>
    <polygon points="0,0 3,-2.5 12,-2.5 9,0" fill="#F59A6B" opacity="0.8"/>
    <polygon points="9,0 12,-2.5 12,6.5 9,9" fill="#8B3A1E" opacity="0.6"/>
  </g>

  <!-- Pfeil (Rotationsrichtung) -->
  <path d="M 32 12 A 20 20 0 0 1 50 30" fill="none" stroke="#BD5A35" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#BD5A35"/>
    </marker>
  </defs>
</svg>
