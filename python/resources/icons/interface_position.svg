<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Interface-Positionierung Icon - zwei LCS-Dreibeine (Quelle/Ziel), Quelle "springt" per
       Pfeil auf Ziel, Haken bestaetigt die einmalige Ausrichtung (Unterscheidung zum
       Import-Component-Icon: hier keine Box/kein Schloss, sondern die Koordinatensysteme selbst) -->
  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Quell-LCS (blass, "Ausgangslage") -->
  <g transform="translate(13, 46)" opacity="0.55">
    <line x1="0" y1="0" x2="13" y2="0" stroke="#D0453B" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="0" y2="-13" stroke="#3FA34D" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="-8" y2="7" stroke="#3A78C2" stroke-width="2.4"/>
    <circle cx="0" cy="0" r="2.2" fill="#333333"/>
  </g>

  <!-- Ziel-LCS (kraeftig, "Andockstelle") -->
  <g transform="translate(45, 20)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#D0453B" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#3FA34D" stroke-width="3"/>
    <line x1="0" y1="0" x2="-9" y2="8" stroke="#3A78C2" stroke-width="3"/>
    <circle cx="0" cy="0" r="2.6" fill="#1E1E1E"/>
  </g>

  <!-- Bewegungspfeil: Quelle springt einmalig auf Ziel -->
  <path d="M 20 40 Q 30 26 40 22" fill="none" stroke="#8B5E1E" stroke-width="2.6"
        stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#arrowheadPos)"/>
  <defs>
    <marker id="arrowheadPos" markerWidth="8" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#8B5E1E"/>
    </marker>
  </defs>

  <!-- Haken: Ausrichtung bestaetigt/fixiert -->
  <path d="M 47 33 L 52 39 L 61 27" fill="none" stroke="#F5A623" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
