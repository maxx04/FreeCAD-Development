<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rename-Icon: Namensschild/Tag mit Stift (Bezeichnung/Article-ID aendern) -->
  <defs>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA3F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Namensschild (abgeschnittene Ecke rechts = Tag-Form) -->
  <path d="M8,20 L40,20 L52,32 L40,44 L8,44 Z" fill="url(#tagGrad)" stroke="#1F4E79" stroke-width="1.5"/>

  <!-- Loch oben links am Schild -->
  <circle cx="16" cy="28" r="2.5" fill="#F0F8FF" stroke="#1F4E79" stroke-width="1"/>

  <!-- Zwei Textzeilen (Bezeichnung + Article-ID) -->
  <line x1="22" y1="29" x2="38" y2="29" stroke="#F0F8FF" stroke-width="2" opacity="0.85"/>
  <line x1="22" y1="35" x2="34" y2="35" stroke="#F0F8FF" stroke-width="2" opacity="0.6"/>

  <!-- Stift unten rechts (Bearbeiten-Symbol) -->
  <g transform="translate(40,38) rotate(45)">
    <rect x="0" y="0" width="7" height="18" rx="1.5" fill="#F5A623" stroke="#B86E04" stroke-width="1"/>
    <polygon points="0,18 7,18 3.5,24" fill="#8B5E1E" stroke="#8B5E1E" stroke-width="1"/>
    <rect x="0" y="0" width="7" height="4" fill="#DDEBF7" opacity="0.8"/>
  </g>
</svg>
