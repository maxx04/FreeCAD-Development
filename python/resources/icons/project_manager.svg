<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Project Manager Icon - Projekt/Ordner -->
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" fill="white" opacity="0"/>
  
  <!-- Ordner-Reiter oben -->
  <rect x="8" y="12" width="20" height="8" fill="url(#folderGrad)" stroke="#B86E04" stroke-width="1"/>
  
  <!-- Ordner Hauptbereich -->
  <path d="M 8 20 L 8 50 Q 8 52 10 52 L 54 52 Q 56 52 56 50 L 56 20 Z" fill="url(#folderGrad)" stroke="#B86E04" stroke-width="1"/>
  
  <!-- Dokumente im Ordner -->
  <!-- Dokument 1 -->
  <rect x="16" y="28" width="6" height="8" fill="#4A90E2" stroke="#2E5C8A" stroke-width="0.5" opacity="0.8"/>
  <line x1="18" y1="30" x2="20" y2="30" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  <line x1="18" y1="32" x2="20" y2="32" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Dokument 2 -->
  <rect x="26" y="26" width="6" height="8" fill="#4A90E2" stroke="#2E5C8A" stroke-width="0.5" opacity="0.8"/>
  <line x1="28" y1="28" x2="30" y2="28" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  <line x1="28" y1="30" x2="30" y2="30" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Dokument 3 -->
  <rect x="36" y="28" width="6" height="8" fill="#4A90E2" stroke="#2E5C8A" stroke-width="0.5" opacity="0.8"/>
  <line x1="38" y1="30" x2="40" y2="30" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="32" x2="40" y2="32" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Konfigurationsschraube unten rechts (als Symbol für Management) -->
  <circle cx="45" cy="42" r="4" fill="none" stroke="#7ED321" stroke-width="1.5" opacity="0.7"/>
  <circle cx="45" cy="42" r="2" fill="#7ED321" opacity="0.5"/>
</svg>
